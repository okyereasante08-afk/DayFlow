<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tsari">
<meta name="theme-color" id="theme-meta" content="#007AFF">
<link rel="manifest" href="manifest.json">
<title>Tsari</title>
<style>
:root{
  --acc:#007AFF;
  --green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--teal:#5AC8FA;--indigo:#5856D6;
  --bg:#F2F2F7;--surface:#FFFFFF;--glass:rgba(255,255,255,.82);
  --fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.07);
  --text:#1C1C1E;--text2:rgba(60,60,67,.55);--text3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.12);
  --sh:0 2px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 6px 28px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --r:14px;--rl:20px;--rxl:26px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --tabh:82px;--mbarh:56px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--surface:#1C1C1E;--glass:rgba(28,28,30,.88);
  --fill:rgba(120,120,128,.22);--fill2:rgba(120,120,128,.14);
  --text:#FFF;--text2:rgba(235,235,245,.55);--text3:rgba(235,235,245,.25);
  --sep:rgba(84,84,88,.6);
  --sh:0 2px 12px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.25);
}}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(var(--tabh) + var(--mbarh) + var(--sb))}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 15% 40%,color-mix(in srgb,var(--acc) 5%,transparent) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 85% 15%,rgba(175,82,222,.04) 0%,transparent 50%)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
#page{position:relative;z-index:1;padding-top:calc(var(--st) + 16px);padding-bottom:8px;min-height:100dvh}
.ph{padding:0 20px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes onboardIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:none}}

.page-enter{animation:fadeUp .38s cubic-bezier(.16,1,.3,1) both}
.page-fr{animation:slideR .32s cubic-bezier(.16,1,.3,1) both}
.page-fl{animation:slideL .32s cubic-bezier(.16,1,.3,1) both}
.stag>*{opacity:0;animation:fadeUp .38s cubic-bezier(.16,1,.3,1) forwards}
.stag>*:nth-child(1){animation-delay:.04s}.stag>*:nth-child(2){animation-delay:.08s}
.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.16s}
.stag>*:nth-child(5){animation-delay:.20s}.stag>*:nth-child(6){animation-delay:.24s}
.stag>*:nth-child(7){animation-delay:.28s}.stag>*:nth-child(8){animation-delay:.32s}
.stag>*:nth-child(9){animation-delay:.36s}.stag>*:nth-child(10){animation-delay:.40s}
.stag>*:nth-child(11){animation-delay:.44s}.stag>*:nth-child(12){animation-delay:.48s}

/* Type */
.t1{font-size:28px;font-weight:700;letter-spacing:.3px}
.t2{font-size:22px;font-weight:700;letter-spacing:.3px}
.t3{font-size:20px;font-weight:600;letter-spacing:.25px}
.hl{font-size:17px;font-weight:600;letter-spacing:-.4px}
.sub{font-size:15px;font-weight:400;letter-spacing:-.2px}
.fn{font-size:13px;font-weight:400}
.sec{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:24px 0 8px;padding:0 20px}

/* Flex helpers */
.flex{display:flex}.ac{align-items:center}.jb{justify-content:space-between}.tc{text-align:center}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mt12{margin-top:12px}.rw{position:relative;display:flex;align-items:center;justify-content:center}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);transform:translateZ(0)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface)}
.row+.row{border-top:.5px solid var(--sep)}
.row:first-child{border-radius:var(--r) var(--r) 0 0}
.row:last-child{border-radius:0 0 var(--r) var(--r)}
.row:only-child{border-radius:var(--r)}
.rg{box-shadow:var(--sh);margin-bottom:20px}

/* Hero cards */
.hcard{border-radius:var(--rxl);padding:20px;margin:0 20px 12px;position:relative;overflow:hidden;
  box-shadow:var(--sh2);transform:translateZ(0);cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;will-change:transform;color:#fff;}
.hcard:active{transform:scale(.975)}
.hcard::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.hcard::after{content:'';position:absolute;bottom:-60px;left:-20px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hcard-inner{position:relative;z-index:1}
.hcard-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.65);margin-bottom:6px}
.hcard-title{font-size:20px;font-weight:700;line-height:1.2;margin-bottom:3px}
.hcard-sub{font-size:14px;color:rgba(255,255,255,.72);margin-bottom:6px}
.hcard-note{font-size:12px;color:rgba(255,255,255,.55);line-height:1.5}
.hcard-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.hcard-badge{background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:100px;backdrop-filter:blur(8px)}
.hcard-chk{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.hcard-chk.on{background:rgba(255,255,255,.9);border-color:transparent}
.hcard-chk.on::after{content:'';width:6px;height:10px;border:2.5px solid #333;
  border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px)}
.hcard.done{opacity:.65}.hcard.done .hcard-title{text-decoration:line-through}
.hcard.actnow{box-shadow:0 8px 32px rgba(0,0,0,.18),var(--sh)}

/* Stat hero cards */
.stat-h{flex:1;border-radius:var(--rl);padding:16px 14px;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.12);color:#fff;}
.stat-h::before{content:'';position:absolute;top:-28px;right:-28px;width:90px;height:90px;
  border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.stat-h-v{font-size:28px;font-weight:700;line-height:1;position:relative;z-index:1}
.stat-h-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:rgba(255,255,255,.65);margin-top:5px;position:relative;z-index:1}

/* Schedule blocks */
.sblk-h{border-radius:var(--rl);padding:16px;margin:0 20px 8px;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.10);cursor:pointer;color:#fff;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .2s;will-change:transform;transform:translateZ(0);}
.sblk-h:active{transform:scale(.977)}
.sblk-h::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.sblk-h::after{content:'';position:absolute;bottom:-40px;left:-10px;width:100px;height:100px;
  border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.sblk-h-inner{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.sblk-h-time{font-size:11px;font-weight:700;color:rgba(255,255,255,.65);min-width:52px;flex-shrink:0}
.sblk-h-info{flex:1}
.sblk-h-t{font-size:16px;font-weight:700;line-height:1.2}
.sblk-h-d{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.sblk-h.done{opacity:.55}.sblk-h.done .sblk-h-t{text-decoration:line-through}
.sblk-h.actnow{box-shadow:0 8px 32px rgba(0,0,0,.2)}

/* Goal cards */
.gcard{border-radius:var(--rxl);padding:20px;margin:0 20px 12px;position:relative;overflow:hidden;
  box-shadow:0 6px 28px rgba(0,0,0,.12);color:#fff;}
.gcard::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.11);pointer-events:none}
.gcard::after{content:'';position:absolute;bottom:-60px;left:-30px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.gcard-inner{position:relative;z-index:1}
.gcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gcard-sym{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;backdrop-filter:blur(8px)}
.gcard-title{font-size:18px;font-weight:700;margin-bottom:1px}
.gcard-sub{font-size:12px;color:rgba(255,255,255,.65)}
.gcard-addbtn{background:rgba(255,255,255,.22);color:#fff;border:none;
  padding:6px 14px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(8px);transition:background .15s}
.gcard-addbtn:active{background:rgba(255,255,255,.35)}
.gcard-pbar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-bottom:14px}
.gcard-pfill{height:100%;border-radius:3px;background:rgba(255,255,255,.9);
  transition:width .7s cubic-bezier(.34,1.56,.64,1)}
.gtask{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;
  border-bottom:.5px solid rgba(255,255,255,.15);transition:opacity .15s}
.gtask:last-child{border-bottom:none}
.gtask:active{opacity:.55}
.gtask-t{font-size:14px;color:rgba(255,255,255,.9);flex:1;line-height:1.35}
.gtask.done .gtask-t{text-decoration:line-through;color:rgba(255,255,255,.4)}
.gtask-chk{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.gtask-chk.on{background:rgba(255,255,255,.9);border-color:transparent}
.gtask-chk.on::after{content:'';width:5px;height:8px;border:2px solid #333;
  border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px)}
.gtask-notes{background:rgba(255,255,255,.15);border:none;border-radius:12px;
  padding:10px 12px;font-family:var(--font);font-size:13px;color:#fff;
  width:100%;resize:none;outline:none;backdrop-filter:blur(8px);margin-top:10px;transition:background .2s}
.gtask-notes:focus{background:rgba(255,255,255,.22)}
.gtask-notes::placeholder{color:rgba(255,255,255,.4)}

/* Plain (no-color) state */
.hcard-plain{background:var(--surface)!important;color:var(--text)!important;box-shadow:var(--sh)!important}
.hcard-plain .hcard-label,.hcard-plain .hcard-sub,.hcard-plain .hcard-note,
.hcard-plain .sblk-h-time,.hcard-plain .sblk-h-d,.hcard-plain .gcard-sub{color:var(--text2)!important}
.hcard-plain .hcard-title,.hcard-plain .sblk-h-t,.hcard-plain .gcard-title{color:var(--text)!important}
.hcard-plain .hcard-chk,.hcard-plain .gtask-chk{border-color:var(--sep)!important}
.hcard-plain .hcard-chk.on,.hcard-plain .gtask-chk.on{background:var(--green)!important;border-color:var(--green)!important}
.hcard-plain .hcard-badge{background:var(--fill)!important;color:var(--text2)!important}
.hcard-plain .gcard-sym{background:var(--fill)!important;color:var(--text)!important}
.hcard-plain .gcard-pbar{background:var(--fill)!important}
.hcard-plain .gcard-pfill{background:var(--acc)!important}
.hcard-plain .gtask{border-bottom-color:var(--sep)!important}
.hcard-plain .gtask-notes{background:var(--fill)!important;color:var(--text)!important}
.hcard-plain .gtask-notes::placeholder{color:var(--text3)!important}
.hcard-plain .gcard-addbtn{background:var(--fill)!important;color:var(--acc)!important}
.hcard-plain .stat-h-l{color:var(--text3)!important}
.hcard-plain::before,.hcard-plain::after{display:none!important}

/* Hero row */
.srow-h{border-radius:var(--rl);padding:16px;margin:0 20px 8px;position:relative;overflow:hidden;
  box-shadow:0 3px 14px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;color:#fff;}
.srow-h::before{content:'';position:absolute;top:-24px;right:-24px;width:90px;height:90px;
  border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.srow-h-inner{flex:1;position:relative;z-index:1}
.srow-h-ctrl{position:relative;z-index:1;flex-shrink:0}

/* Gradient presets */
.hg-blue{background:linear-gradient(135deg,#007AFF,#5856D6)}
.hg-green{background:linear-gradient(135deg,#34C759,#30B0C7)}
.hg-purple{background:linear-gradient(135deg,#AF52DE,#FF2D55)}
.hg-orange{background:linear-gradient(135deg,#FF9500,#FF6B00)}
.hg-red{background:linear-gradient(135deg,#FF3B30,#FF9500)}
.hg-teal{background:linear-gradient(135deg,#5AC8FA,#007AFF)}
.hg-cyan{background:linear-gradient(135deg,#64D2FF,#30B0C7)}
.hg-gray{background:linear-gradient(135deg,#8E8E93,#636366)}
.hg-indigo{background:linear-gradient(135deg,#5856D6,#AF52DE)}
.hg-pink{background:linear-gradient(135deg,#FF2D55,#AF52DE)}
.hg-profile{background:linear-gradient(135deg,#5856D6,#AF52DE)}
.hg-notif{background:linear-gradient(135deg,#FF3B30,#FF9500)}
.hg-app{background:linear-gradient(135deg,#8E8E93,#636366)}
.hg-stats-done{background:linear-gradient(135deg,#007AFF,#5856D6)}
.hg-stats-left{background:linear-gradient(135deg,#34C759,#30B0C7)}
.hg-stats-hrs{background:linear-gradient(135deg,#FF9500,#FF6B00)}
.hg-stats-str{background:linear-gradient(135deg,#FF3B30,#FF9500)}

/* White toggle */
.tog-w{width:51px;height:31px;border-radius:100px;border:none;cursor:pointer;
  position:relative;background:rgba(255,255,255,.3);flex-shrink:0;
  transition:background .28s cubic-bezier(.4,0,.2,1)}
.tog-w.on{background:rgba(255,255,255,.9)}
.tog-w::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;
  border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.tog-w.on::after{transform:translateX(20px);background:#34C759}
.sel-w{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:8px 12px;
  font-family:var(--font);font-size:14px;color:#fff;outline:none;-webkit-appearance:none;cursor:pointer;backdrop-filter:blur(8px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 20px;border-radius:100px;border:none;font-family:var(--font);
  font-size:16px;font-weight:600;cursor:pointer;letter-spacing:-.2px;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),opacity .12s ease;will-change:transform}
.btn:active{transform:scale(.96);opacity:.85}
.btn-p{background:var(--acc);color:#fff}
.btn-s{background:var(--fill);color:var(--text)}
.btn-d{background:#FF3B30;color:#fff}
.btn-sm{font-size:14px;padding:7px 16px}
.btn-fw{width:100%}
.btn-ghost{background:rgba(255,255,255,.2);border:none;border-radius:100px;padding:7px 16px;
  font-family:var(--font);font-size:14px;font-weight:600;color:#fff;cursor:pointer;
  backdrop-filter:blur(8px);transition:background .15s}
.btn-ghost:active{background:rgba(255,255,255,.35)}

/* Inputs */
.inp{width:100%;background:var(--fill);border:.5px solid var(--sep);border-radius:12px;
  padding:12px 14px;font-family:var(--font);font-size:16px;color:var(--text);outline:none;
  transition:border-color .2s,background .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--acc);background:var(--fill2)}
.sel{width:100%;background:var(--fill);border:.5px solid var(--sep);border-radius:12px;
  padding:12px 14px;font-family:var(--font);font-size:16px;color:var(--text);outline:none;
  -webkit-appearance:none;cursor:pointer}
.sel:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:80px}

/* Time indicator */
.tind{display:flex;align-items:center;gap:8px;padding:4px 20px 4px;margin:4px 0}
.tind-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}
.tind-line{flex:1;height:1px;background:var(--acc);opacity:.4}
.tind-lbl{font-size:11px;font-weight:600;color:var(--acc)}

/* Avatar button */
.av-btn{width:60px;height:60px;border-radius:18px;border:none;font-size:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.av-btn:active{transform:scale(.9)}
.acc-sw{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.acc-sw:active{transform:scale(1.2)}
.acc-sw.active{border-color:#fff;transform:scale(1.15)}

/* Toast */
.toast{position:fixed;top:calc(var(--st)+20px);left:50%;transform:translateX(-50%);
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.14),0 0 0 .5px var(--sep);z-index:9999;
  white-space:nowrap;animation:fadeDown .3s cubic-bezier(.34,1.56,.64,1)}
.toast-i{font-size:22px}

/* Tab bar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;
  background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:.5px solid var(--sep);
  display:flex;padding-bottom:var(--sb);height:calc(var(--tabh) + var(--sb))}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:none;background:none;color:var(--text3);font-family:var(--font);font-size:10px;
  font-weight:600;letter-spacing:.02em;cursor:pointer;
  transition:color .2s,transform .15s cubic-bezier(.34,1.56,.64,1);padding-top:10px}
.ti svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.ti.on{color:var(--acc)}.ti.on svg{transform:scale(1.1)}

/* Music bar */
.mbar{position:fixed;bottom:calc(var(--tabh) + var(--sb));left:0;right:0;z-index:999;
  background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:.5px solid var(--sep);transition:height .3s cubic-bezier(.16,1,.3,1);
  height:var(--mbarh);overflow:hidden}
.mbar-top{height:var(--mbarh);display:flex;align-items:center;padding:0 16px;gap:10px;cursor:pointer}
.mbar-eq{display:flex;align-items:flex-end;gap:2.5px;height:18px;width:18px;flex-shrink:0}
.mbar-eq span{width:3px;border-radius:2px;background:var(--acc);transition:background .3s}
.mbar-eq span:nth-child(1){animation:eq .9s ease-in-out infinite}
.mbar-eq span:nth-child(2){animation:eq .9s ease-in-out .15s infinite}
.mbar-eq span:nth-child(3){animation:eq .9s ease-in-out .3s infinite}
.mbar-eq.paused span{animation:none;height:3px}
.mbar-track{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.mbar-state{font-size:11px;color:var(--text3);margin-top:1px}
.mbar-ctrl{display:flex;align-items:center;gap:8px}
.mplay{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--acc);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.mplay:active{transform:scale(.88)}
.mchev{width:20px;height:20px;color:var(--text3);transition:transform .3s}
.mpanel{padding:12px 16px 16px;display:none}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sopt{border-radius:12px;padding:10px 8px;background:var(--fill);text-align:center;cursor:pointer;
  transition:all .15s;border:1.5px solid transparent}
.sopt.active{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:var(--acc)}
.sopt-name{font-size:12px;font-weight:600;color:var(--text);margin:4px 0 2px}
.sopt-desc{font-size:10px;color:var(--text3)}
.mvol-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
input[type=range]{flex:1;accent-color:var(--acc);height:4px}
.cust-row{display:flex;gap:8px}
.cust-row input{flex:1}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);
  animation:fadeUp .22s cubic-bezier(.16,1,.3,1)}
.modal{background:var(--surface);border-radius:var(--rxl) var(--rxl) 0 0;padding:28px 20px 32px;
  width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;animation:fadeUp .32s cubic-bezier(.16,1,.3,1)}
.modal-h{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 20px}

/* PWA install banner */
.ibanner{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--rl);
  box-shadow:var(--sh2);padding:14px 16px;margin:0 20px 16px}
.ibanner button{background:var(--acc);color:#fff;border:none;border-radius:100px;
  padding:8px 18px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Streak fire */
.streak-badge{background:linear-gradient(135deg,#FF3B30,#FF9500);border-radius:100px;
  padding:4px 12px;font-size:13px;font-weight:700;color:#fff;display:inline-flex;align-items:center;gap:4px}

/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-ico{font-size:44px;margin-bottom:12px}
.empty-t{font-size:17px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-s{font-size:14px;line-height:1.5}

/* Onboarding */
#onboard{position:fixed;inset:0;z-index:5000;background:var(--bg);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(var(--st) + 32px) 24px 48px;}
.ob-hero{font-size:64px;margin-bottom:16px;animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
.ob-step{width:100%;max-width:420px;animation:onboardIn .45s cubic-bezier(.16,1,.3,1) both}
.ob-tag{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  padding:4px 12px;border-radius:100px;display:inline-block;margin-bottom:10px}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{padding:8px 16px;border-radius:100px;border:1.5px solid var(--sep);background:var(--fill);
  font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.chip.on{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:var(--acc);color:var(--acc)}
.ob-progress{display:flex;gap:6px;margin-bottom:32px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--fill);transition:all .3s}
.ob-dot.on{background:var(--acc);width:20px;border-radius:4px}

/* Color picker swatch */
.cswatch{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.cswatch:active{transform:scale(1.15)}
.cswatch.on{border-color:#fff;transform:scale(1.18)}
.hcard-plain .cswatch.on{border-color:var(--acc)}

/* Soon badge */
.soon{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  background:var(--orange);color:#fff;padding:2px 7px;border-radius:100px;vertical-align:middle}

/* Drag to delete hint */
.del-hint{font-size:12px;color:var(--text3);text-align:center;padding:4px 0 0}

/* Category pill */
.cat-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;
  font-size:12px;font-weight:600}
</style>
</head>
<body>

<div id="onboard" style="display:none"></div>

<div id="page"></div>

<!-- Music bar -->
<div class="mbar" id="mbar">
  <div class="mbar-top" onclick="togglePanel()">
    <div class="mbar-eq paused" id="meq">
      <span></span><span></span><span></span>
    </div>
    <div style="flex:1">
      <div class="mbar-track" id="mtrack">Focus Music</div>
      <div class="mbar-state" id="mstate">Tap to play</div>
    </div>
    <div class="mbar-ctrl" onclick="event.stopPropagation()">
      <button class="mplay" id="mplaybtn" onclick="mTogglePlay()">
        <svg width="13" height="13" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg>
      </button>
    </div>
    <svg class="mchev" id="mchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
  </div>
  <div class="mpanel" id="mpanel">
    <div class="sgrid" id="sgrid"></div>
    <div class="mvol-row">
      <span style="font-size:14px">🔈</span>
      <input type="range" id="mvol" min="0" max="100" value="70" oninput="mSetVol(+this.value)">
      <span style="font-size:14px">🔊</span>
    </div>
    <div class="cust-row">
      <input class="inp" id="cust-id" placeholder="YouTube ID or URL…" style="font-size:14px;padding:9px 12px">
      <button class="btn btn-p btn-sm" onclick="mPlayCustom()">Play</button>
    </div>
  </div>
</div>

<!-- Tab bar -->
<nav>
  <button class="ti on" onclick="nav('today')" id="tab-today">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Today</span>
  </button>
  <button class="ti" onclick="nav('schedule')" id="tab-schedule">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Schedule</span>
  </button>
  <button class="ti" onclick="nav('focus')" id="tab-focus">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    <span>Focus</span>
  </button>
  <button class="ti" onclick="nav('goals')" id="tab-goals">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="11" opacity=".4"/></svg>
    <span>Goals</span>
  </button>
  <button class="ti" onclick="nav('settings')" id="tab-settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <span>Settings</span>
  </button>
</nav>

<script>
/* ─── STREAMS ─── */
const STREAMS=[
  {id:'jfKfPfyJRdk',name:'Lofi Girl',    desc:'Hip hop · 24/7',      icon:'📚'},
  {id:'5qap5aO4i9A',name:'Chillhop',     desc:'Jazz hop · chill',    icon:'🎷'},
  {id:'7NOSDKb0HlU',name:'Deep Focus',   desc:'Minimal · no lyrics', icon:'🧠'},
  {id:'DWcJFNfaw9c',name:'Jazz Café',    desc:'Coffee shop vibes',   icon:'☕'},
  {id:'4oStw0r33so',name:'Classical',    desc:'Study classics',      icon:'🎻'},
  {id:'qHBLpY31FAY',name:'Nature',       desc:'Ambient sounds',      icon:'🌿'},
  {id:'Dx5qFachd3A',name:'Synthwave',    desc:'Retro focus beats',   icon:'🌆'},
  {id:'5yx6BWlEVcY',name:'Piano',        desc:'Solo piano · calm',   icon:'🎹'},
];

/* ─── GRADIENT PRESETS ─── */
const GRAD_PRESETS=[
  {key:'blue',  label:'Ocean',   grad:'hg-blue',   c:'#007AFF',c2:'#5856D6'},
  {key:'green', label:'Forest',  grad:'hg-green',  c:'#34C759',c2:'#30B0C7'},
  {key:'purple',label:'Grape',   grad:'hg-purple', c:'#AF52DE',c2:'#FF2D55'},
  {key:'orange',label:'Sunset',  grad:'hg-orange', c:'#FF9500',c2:'#FF6B00'},
  {key:'red',   label:'Ember',   grad:'hg-red',    c:'#FF3B30',c2:'#FF9500'},
  {key:'teal',  label:'Arctic',  grad:'hg-teal',   c:'#5AC8FA',c2:'#007AFF'},
  {key:'cyan',  label:'Sky',     grad:'hg-cyan',   c:'#64D2FF',c2:'#30B0C7'},
  {key:'indigo',label:'Night',   grad:'hg-indigo', c:'#5856D6',c2:'#AF52DE'},
  {key:'pink',  label:'Rose',    grad:'hg-pink',   c:'#FF2D55',c2:'#AF52DE'},
  {key:'gray',  label:'Stone',   grad:'hg-gray',   c:'#8E8E93',c2:'#636366'},
];

const AVATARS=['🧑‍💻','👨‍🎓','👩‍🎓','🚀','🦁','🐯','⚡','🔥','🎯','🌟','🧠','🎓','😤','💪','🏆','🌈','🦅','🐉','🎸','🎨','🏄','🧗','🏋️','📚','💎'];
const ACCENTS=[{n:'Blue',c:'#007AFF'},{n:'Indigo',c:'#5856D6'},{n:'Purple',c:'#AF52DE'},{n:'Green',c:'#34C759'},{n:'Orange',c:'#FF9500'},{n:'Red',c:'#FF3B30'},{n:'Teal',c:'#5AC8FA'}];

/* ─── DEFAULT STATE (empty — user fills everything) ─── */
function defState(){
  return{
    schedule:[],
    done:{},
    tdone:{},
    subjects:{},           // {id: {label, sym, grad, tasks:[], notes:''}}
    catColors:{},          // override per subject id
    catColorEnabled:{},    // false = plain
    allColorsEnabled:true,
    timer:{subj:null,work:50,brk:10,left:50*60,isBreak:false,running:false,sessions:0},
    settings:{notifs:false,notifyMin:5,snotifs:{}},
    profile:{name:'',avatar:'🚀',accent:'#007AFF'},
    notifPerm:'default',
    streaks:{},            // {date: count}  — rolling streak
    weeklyHrs:{},          // {YYYY-WW: minutes}
    onboarded:false,
    nextCatId:1,
  };
}

let S=(()=>{
  try{
    const r=localStorage.getItem('tsari_v1');
    if(r){
      const p=JSON.parse(r);
      return{...defState(),...p,
        profile:{...defState().profile,...(p.profile||{})},
        settings:{...defState().settings,...(p.settings||{})},
        catColors:{...defState().catColors,...(p.catColors||{})},
        catColorEnabled:{...defState().catColorEnabled,...(p.catColorEnabled||{})},
      };
    }
  }catch(e){}
  return defState();
})();
const save=()=>localStorage.setItem('tsari_v1',JSON.stringify(S));

/* ─── ROUTING ─── */
const TABS=['today','schedule','focus','goals','settings'];
let view='today',prevIdx=0,timerTick=null,installPrompt=null;

function nav(v){
  if(v!=='focus')stopTimer();
  const ni=TABS.indexOf(v),dir=ni>prevIdx?'fl':'fr';
  prevIdx=ni;view=v;
  document.querySelectorAll('.ti').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+v)?.classList.add('on');
  render(dir);window.scrollTo({top:0,behavior:'smooth'});
}
function render(dir='enter'){
  const cls=dir==='fl'?'page-fl':dir==='fr'?'page-fr':'page-enter';
  const fn={today:rToday,schedule:rSchedule,focus:rFocus,goals:rGoals,settings:rSettings};
  document.getElementById('page').innerHTML=`<div class="stag ${cls}">${(fn[view]||rToday)()}</div>`;
  if(view==='focus')initTimer();
}

/* ─── UTILS ─── */
const today=()=>new Date().toISOString().split('T')[0];
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const t2m=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtT=t=>{const[h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM',hr=h%12||12;return`${hr}:${String(m).padStart(2,'0')} ${ap}`;};
const fmtMin=m=>m?`${Math.floor(m/60)?Math.floor(m/60)+'h ':''} ${m%60?m%60+'m':''}`.trim():'';
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';};
const fmtSec=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const uid=()=>'u'+Date.now()+Math.random().toString(36).slice(2,6);
const weekKey=()=>{const d=new Date(),y=d.getFullYear();const w=Math.ceil(((d-new Date(y,0,1))/86400000+new Date(y,0,1).getDay()+1)/7);return`${y}-W${w}`;};

/* ─── STREAK ─── */
function updateStreak(){
  const td=today(),yd=new Date(Date.now()-86400000).toISOString().split('T')[0];
  if(!S.streaks)S.streaks={};
  const last=S.streaks.lastDate;
  if(last===td)return;
  if(last===yd){S.streaks.count=(S.streaks.count||0)+1;}
  else if(last!==td){S.streaks.count=1;}
  S.streaks.lastDate=td;save();
}
const streakCount=()=>S.streaks?.count||0;

/* ─── CATEGORY HELPERS ─── */
function getCat(id){
  return S.subjects[id]||{label:'Unknown',sym:'?',grad:'hg-gray',c:'#8E8E93',c2:'#636366'};
}
function catStyle(id){
  if(S.allColorsEnabled===false||S.catColorEnabled?.[id]===false)return null;
  const ov=S.catColors?.[id];
  if(ov)return`background:linear-gradient(135deg,${ov},${ov}cc)`;
  return null;
}
function catGradClass(id){
  if(S.allColorsEnabled===false||S.catColorEnabled?.[id]===false)return'hcard-plain';
  if(S.catColors?.[id])return'';
  return getCat(id).grad||'hg-gray';
}
function isCatColored(id){return S.allColorsEnabled!==false&&S.catColorEnabled?.[id]!==false;}
function catCardAttrs(id){
  const gc=catGradClass(id),cs=catStyle(id);
  return{gc,cs,colored:isCatColored(id)};
}

/* ─── SCHEDULE ─── */
const schd=()=>[...S.schedule].sort((a,b)=>t2m(a.time)-t2m(b.time));
const bDone=()=>S.done[today()]||[];
const isBlkDone=id=>bDone().includes(id);
const prog=()=>{const d=bDone().length,t=schd().filter(b=>b.dur>0).length;return{d,t,pct:t?Math.round(d/t*100):0};};
const studyHrs=()=>{let m=0;schd().forEach(b=>{if(S.subjects[b.cat]&&isBlkDone(b.id))m+=b.dur;});return(m/60).toFixed(1);};
function curBlk(){const n=nowMin();return schd().find(b=>{const s=t2m(b.time);return n>=s&&n<s+b.dur;})||null;}
function nxtBlk(){const n=nowMin();return schd().find(b=>t2m(b.time)>n)||null;}
function togBlk(id){
  if(!S.done[today()])S.done[today()]=[];
  const i=S.done[today()].indexOf(id);
  if(i>-1)S.done[today()].splice(i,1);
  else{S.done[today()].push(id);updateStreak();}
  // accumulate weekly study hours
  const blk=S.schedule.find(x=>x.id===id);
  if(blk&&blk.dur){if(!S.weeklyHrs)S.weeklyHrs={};S.weeklyHrs[weekKey()]=(S.weeklyHrs[weekKey()]||0)+blk.dur;}
  save();render();
}

/* ─── TODAY ─── */
function rToday(){
  const p=prog(),nm=nowMin(),hero=curBlk()||nxtBlk(),isNow=!!curBlk();
  const name=S.profile.name||'Champion';
  const str=streakCount();
  let h='';
  h+=`<div class="ph flex ac jb mb16">
    <div>
      <div style="font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div class="t1">${greet()}, ${name} ${S.profile.avatar}</div>
      ${str>1?`<div style="margin-top:6px"><span class="streak-badge">🔥 ${str}-day streak</span></div>`:''}
    </div>
    <div style="position:relative;width:64px;height:64px">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="27" fill="none" stroke="var(--fill)" stroke-width="5.5"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="var(--acc)" stroke-width="5.5"
          stroke-linecap="round" stroke-dasharray="169.6"
          stroke-dashoffset="${(169.6*(1-p.pct/100)).toFixed(1)}"
          transform="rotate(-90 32 32)"
          style="transition:stroke-dashoffset .7s cubic-bezier(.34,1.56,.64,1)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="font-size:14px;font-weight:700">${p.pct}%</div>
      </div>
    </div>
  </div>`;

  h+=`<div id="islot"></div>`;

  /* Stats */
  const wkHrs=((S.weeklyHrs?.[weekKey()]||0)/60).toFixed(1);
  h+=`<div class="flex g8 ph mb16">
    <div class="stat-h hg-stats-done" style="flex:1">
      <div class="stat-h-v">${p.d}</div>
      <div class="stat-h-l">Done</div>
    </div>
    <div class="stat-h hg-stats-left" style="flex:1">
      <div class="stat-h-v">${p.t-p.d}</div>
      <div class="stat-h-l">Left</div>
    </div>
    <div class="stat-h hg-stats-hrs" style="flex:1">
      <div class="stat-h-v">${studyHrs()}</div>
      <div class="stat-h-l">Hrs today</div>
    </div>
    <div class="stat-h hg-stats-str" style="flex:1">
      <div class="stat-h-v">${wkHrs}</div>
      <div class="stat-h-l">This week</div>
    </div>
  </div>`;

  /* Hero block */
  if(hero){
    const cat=getCat(hero.cat);
    const{gc,cs,colored}=catCardAttrs(hero.cat);
    const heroSt=cs?`${cs};margin-bottom:16px`:`margin-bottom:16px`;
    h+=`<div class="hcard ${gc}" style="${heroSt}">
      <div style="position:relative;z-index:1">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:${colored?'rgba(255,255,255,.65)':'var(--text3)'};margin-bottom:6px">${isNow?'▶ Now':'⏭ Up next'}</div>
        <div style="font-size:26px;font-weight:700;color:${colored?'#fff':'var(--text)'};margin-bottom:4px;line-height:1.15">${hero.title}</div>
        <div style="font-size:15px;color:${colored?'rgba(255,255,255,.75)':'var(--text2)'}">${fmtT(hero.time)}${hero.dur?' · '+fmtMin(hero.dur):''}</div>
        ${hero.note?`<div style="font-size:13px;color:${colored?'rgba(255,255,255,.6)':'var(--text3)'};margin-top:8px;line-height:1.5">${hero.note}</div>`:''}
      </div>
    </div>`;
  }

  const blocks=schd();
  if(blocks.length===0){
    h+=`<div class="empty"><div class="empty-ico">📅</div><div class="empty-t">No blocks yet</div><div class="empty-s">Go to Schedule to add your daily blocks</div></div>`;
  } else {
    h+=`<div class="sec">Today's blocks</div>`;
    let pastNow=false;
    for(const b of blocks){
      const bm=t2m(b.time),inNow=nm>=bm&&nm<bm+b.dur,isPast=nm>=bm+b.dur&&b.dur>0,done=isBlkDone(b.id);
      const cat=getCat(b.cat);
      if(!pastNow&&bm>nm){pastNow=true;h+=`<div class="tind"><div class="tind-dot"></div><div class="tind-line"></div><div class="tind-lbl">${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></div>`;}
      const{gc,cs,colored}=catCardAttrs(b.cat);
      h+=`<div class="sblk-h ${gc}${inNow?' actnow':''}${done?' done':''}" ${cs?`style="${cs}"`:''}  onclick="togBlk('${b.id}')">
        <div class="sblk-h-inner">
          <div style="flex:1">
            <div class="sblk-h-time">${fmtT(b.time)}</div>
            <div class="sblk-h-t">${b.title}</div>
            ${b.dur?`<div class="sblk-h-d">${fmtMin(b.dur)}${inNow?' · in progress':isPast?' · past':''}</div>`:`<div class="sblk-h-d">no duration</div>`}
            ${b.note?`<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;line-height:1.45">${b.note}</div>`:''}
          </div>
          ${b.dur?`<div class="hcard-chk${done?' on':''}"></div>`:''}
        </div>

/* ─── FOCUS TIMER ─── */
function rFocus(){
  const t=S.timer;
  const subjKeys=Object.keys(S.subjects);
  if(!t.subj&&subjKeys.length)t.subj=subjKeys[0];
  const cat=t.subj?getCat(t.subj):{c:'#007AFF',c2:'#5856D6',sym:'⚡',label:'Focus'};
  const total=(t.isBreak?t.brk:t.work)*60,CC=2*Math.PI*88;
  const off=(CC*(1-t.left/total)).toFixed(1);
  return`<div class="ph flex ac jb mb16"><div class="t2">Focus</div>
    <div style="font-size:14px;color:var(--text3)">🔥 ${t.sessions} sessions</div></div>
    <div class="tc ph mb12">
      <span style="padding:5px 16px;border-radius:100px;background:linear-gradient(135deg,${cat.c||'#007AFF'},${cat.c2||'#5856D6'});color:#fff;font-size:13px;font-weight:600;box-shadow:0 2px 12px ${cat.c||'#007AFF'}44">
        ${t.isBreak?'☕ Break time':'⚡ '+(t.subj?cat.label:'Focus')}
      </span>
    </div>
    <div class="rw" style="width:232px;height:232px;margin:0 auto">
      <svg width="232" height="232" viewBox="0 0 232 232">
        <circle cx="116" cy="116" r="88" fill="none" stroke="var(--fill)" stroke-width="10"/>
        <circle id="timer-ring" cx="116" cy="116" r="88" fill="none" stroke="${cat.c||'var(--acc)'}" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${CC.toFixed(1)}" stroke-dashoffset="${off}"
          transform="rotate(-90 116 116)" style="transition:stroke-dashoffset 1s linear"/>
      </svg>
      <div style="position:absolute;text-align:center">
        <div id="timer-disp" style="font-size:48px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums">${fmtSec(t.left)}</div>
        <div style="font-size:13px;color:var(--text3);margin-top:2px">${t.isBreak?'Break':'Work session'}</div>
      </div>
    </div>
    <div class="flex g12 ph" style="margin-top:24px;justify-content:center">
      <button class="btn btn-s" onclick="tReset()">↩ Reset</button>
      <button class="btn btn-p" style="min-width:90px" onclick="tToggle()">${t.running?'⏸ Pause':'▶ Start'}</button>
      <button class="btn btn-s" onclick="tSkip()">Skip →</button>
    </div>
    <div class="hcard hg-app" style="margin-top:20px">
      <div class="hcard-inner">
        ${subjKeys.length?`
        <div class="flex ac jb mb12">
          <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.7)">Subject</span>
          <select class="sel-w" onchange="tSetSubj(this.value)">
            ${subjKeys.map(k=>`<option value="${k}"${t.subj===k?' selected':''}>${getCat(k).label}</option>`).join('')}
          </select>
        </div>`:'<div style="font-size:13px;color:rgba(255,255,255,.6);margin-bottom:12px">Add subjects in Goals to track sessions</div>'}
        <div class="flex ac jb mb10">
          <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.7)">Work</span>
          <select class="sel-w" onchange="tSetWork(+this.value)">
            ${[15,20,25,30,45,50,60,90].map(m=>`<option value="${m}"${t.work===m?' selected':''}>${m} min</option>`).join('')}
          </select>
        </div>
        <div class="flex ac jb">
          <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.7)">Break</span>
          <select class="sel-w" onchange="S.timer.brk=+this.value;save()">
            ${[5,10,15,20,30].map(m=>`<option value="${m}"${t.brk===m?' selected':''}>${m} min</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
}
function initTimer(){if(S.timer.running&&!timerTick)startTick();}
function tToggle(){S.timer.running=!S.timer.running;if(S.timer.running)startTick();else{clearInterval(timerTick);timerTick=null;}save();render();}
function startTick(){
  clearInterval(timerTick);
  timerTick=setInterval(()=>{
    if(!S.timer.running)return;
    S.timer.left--;
    if(S.timer.left<=0){
      const wb=S.timer.isBreak;S.timer.isBreak=!wb;S.timer.running=false;
      S.timer.left=(S.timer.isBreak?S.timer.brk:S.timer.work)*60;
      if(!wb)S.timer.sessions++;
      clearInterval(timerTick);timerTick=null;save();
      showNotif(wb?'Focus time!':'Break time 🎉',wb?'Start your next session.':'Great work! '+S.timer.brk+' min break.');
      render();return;
    }
    save();
    const d=document.getElementById('timer-disp');
    const r=document.getElementById('timer-ring');
    if(d)d.textContent=fmtSec(S.timer.left);
    if(r){const t=S.timer,tot=(t.isBreak?t.brk:t.work)*60,CC=2*Math.PI*88;r.setAttribute('stroke-dashoffset',(CC*(1-t.left/tot)).toFixed(1));}
  },1000);
}
function tReset(){clearInterval(timerTick);timerTick=null;S.timer.running=false;S.timer.isBreak=false;S.timer.left=S.timer.work*60;save();render();}
function tSkip(){clearInterval(timerTick);timerTick=null;S.timer.running=false;S.timer.isBreak=!S.timer.isBreak;S.timer.left=(S.timer.isBreak?S.timer.brk:S.timer.work)*60;save();render();}
function stopTimer(){clearInterval(timerTick);timerTick=null;if(S.timer.running){S.timer.running=false;save();}}
function tSetSubj(v){S.timer.subj=v;if(!S.timer.running)S.timer.left=S.timer.work*60;save();render();}
function tSetWork(v){S.timer.work=v;if(!S.timer.running)S.timer.left=v*60;save();render();}

/* ─── GOALS ─── */
function rGoals(){
  const subjKeys=Object.keys(S.subjects);
  const tdTotal=subjKeys.reduce((a,k)=>(S.subjects[k].tasks||[]).length+a,0);
  const tdDone=subjKeys.reduce((a,k)=>(S.subjects[k].tasks||[]).filter((_,i)=>S.tdone[k+'-'+i]).length+a,0);
  let h=`<div class="ph flex ac jb mb16"><div class="t2">Goals</div>
    <div class="flex g8 ac">
      <div style="font-size:14px;color:var(--text3)">${tdDone}/${tdTotal}</div>
      <button class="btn btn-p btn-sm" onclick="openAddSubj()">+ Subject</button>
    </div>
  </div>`;

  if(subjKeys.length){
    h+=`<div class="hcard hg-stats-done" style="margin-bottom:16px">
      <div class="hcard-inner">
        <div class="hcard-label">Overall progress</div>
        <div style="font-size:32px;font-weight:700;color:#fff;line-height:1">${tdTotal?Math.round(tdDone/tdTotal*100):0}%</div>
        <div style="margin-top:10px;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden">
          <div style="height:100%;border-radius:3px;background:rgba(255,255,255,.9);width:${tdTotal?Math.round(tdDone/tdTotal*100):0}%;transition:width .7s cubic-bezier(.34,1.56,.64,1)"></div>
        </div>
        <div style="font-size:12px;color:rgba(255,255,255,.65);margin-top:6px">${tdDone} of ${tdTotal} tasks complete</div>
      </div>
    </div>`;
  }

  for(const key of subjKeys){
    const subj=S.subjects[key],tasks=subj.tasks||[];
    const dn=tasks.filter((_,i)=>S.tdone[key+'-'+i]).length,pct=tasks.length?Math.round(dn/tasks.length*100):0;
    const{gc,cs,colored}=catCardAttrs(key);
    h+=`<div class="gcard ${gc}" ${cs?`style="${cs}"`:''}><div class="gcard-inner">
      <div class="gcard-head">
        <div class="flex ac g12">
          <div class="gcard-sym">${subj.sym}</div>
          <div>
            <div class="gcard-title">${subj.label}</div>
            <div class="gcard-sub">${dn}/${tasks.length} · ${pct}%</div>
          </div>
        </div>
        <div class="flex g8">
          <button class="gcard-addbtn" onclick="addTask('${key}')">+ Task</button>
          <button onclick="openEditSubj('${key}')" style="background:rgba(255,255,255,.15);border:none;border-radius:100px;padding:6px 10px;font-size:13px;cursor:pointer;color:#fff">✎</button>
        </div>
      </div>
      <div class="gcard-pbar"><div class="gcard-pfill" style="width:${pct}%"></div></div>
      ${tasks.map((t,i)=>`<div class="gtask${S.tdone[key+'-'+i]?' done':''}" onclick="togTask('${key}-${i}')">
        <div class="gtask-chk${S.tdone[key+'-'+i]?' on':''}"></div>
        <span class="gtask-t">${t}</span>
        <button onclick="event.stopPropagation();delTask('${key}',${i})" style="background:rgba(255,255,255,.15);border:none;border-radius:50%;width:20px;height:20px;font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">✕</button>
      </div>`).join('')}
      ${tasks.length===0?`<div style="font-size:13px;color:rgba(255,255,255,.45);text-align:center;padding:12px 0">No tasks yet · tap "+ Task" to add</div>`:''}
      <textarea class="gtask-notes" rows="2" placeholder="Notes for ${subj.label}…"
        onchange="S.subjects['${key}'].notes=this.value;save()">${subj.notes||''}</textarea>
    </div></div>`;
  }

  if(subjKeys.length===0){
    h+=`<div class="empty"><div class="empty-ico">🎯</div><div class="empty-t">No subjects yet</div><div class="empty-s">Tap "+ Subject" to add what you're working towards</div></div>`;
  }
  return h;
}
function togTask(k){S.tdone[k]=!S.tdone[k];save();render();}
function addTask(k){const t=prompt('New task for '+S.subjects[k]?.label+':');if(t?.trim()){S.subjects[k].tasks.push(t.trim());save();render();}}
function delTask(k,i){if(confirm('Delete this task?')){S.subjects[k].tasks.splice(i,1);const newTd={};Object.entries(S.tdone).forEach(([key,v])=>{const[sk,si]=key.split('-');if(sk!==k){newTd[key]=v;}else{const n=+si;if(n<i)newTd[key]=v;else if(n>i)newTd[`${sk}-${n-1}`]=v;}});S.tdone=newTd;save();render();}}

/* ─── NOTIFICATIONS ─── */
async function reqNotif(){
  if(!('Notification' in window)){toast('⚠️','Not supported','Use Chrome or Safari for notifications');return;}
  const p=await Notification.requestPermission();S.notifPerm=p;save();
  if(p==='granted'){toast('🔔','Notifications on','Reminders set for each block');reschedNotifs();}
  else toast('⚠️','Denied','Enable in browser/OS settings');
  render();
}
function reschedNotifs(){
  if(S.notifPerm!=='granted'||!S.settings.notifs)return;
  const nm=nowMin(),min=S.settings.notifyMin;
  schd().forEach(b=>{
    if(!b.dur||!S.settings.snotifs[b.cat])return;
    const rem=t2m(b.time)-min;if(rem<=nm)return;
    const ms=(rem-nm)*60*1000;
    const fire=()=>new Notification(`⏰ In ${min} min: ${b.title}`,{body:`${fmtT(b.time)} · ${fmtMin(b.dur)}`,tag:b.id});
    navigator.serviceWorker?.controller
      ?navigator.serviceWorker.controller.postMessage({type:'SCHEDULE_NOTIF',title:`⏰ In ${min} min: ${b.title}`,body:`${fmtT(b.time)} · ${fmtMin(b.dur)}`,delay:ms})
      :setTimeout(fire,ms);
  });
}
function showNotif(title,body){if(S.notifPerm==='granted')new Notification(title,{body});toast('🔔',title,body);}
function togNotifs(){S.settings.notifs=!S.settings.notifs;save();render();if(S.settings.notifs)reqNotif();}

  if(!ytLoaded){loadYT();toast('🎵','Loading music…','Starting in a moment');

  if(!ytReady||!ytPlayer){toast('🎵','Loading…','Music will start shortly');return;}

      <div class="t2" style="margin-bottom:8px">What are you working on?</div>
      <div style="font-size:15px;color:var(--text2);margin-bottom:20px">Pick subjects or areas — you can add more later.</div>
      <div class="chip-grid">
        ${OB_SUBJ_SUGGESTIONS.map(s=>`<div class="chip${ob.subjects.includes(s.label)?' on':''}" onclick="obToggleSubj('${s.label}')">${s.sym} ${s.label}</div>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--text3);margin-top:8px;margin-bottom:24px">Or skip — add custom subjects later from the Goals tab</div>
      <div class="ob-progress" style="margin-bottom:24px">${dots}</div>
      <button class="btn btn-p btn-fw" onclick="obNext()" style="font-size:17px;padding:13px">Continue →</button>
    </div>`;
  } else if(obStep===3){
    inner=`<div class="ob-step">
      <div class="ob-hero">🎨</div>
      <div class="ob-tag">Step 3 of 3</div>
      <div class="t2" style="margin-bottom:8px">Choose a colour</div>
      <div style="font-size:15px;color:var(--text2);margin-bottom:24px">This is your accent throughout the app.</div>
      <div class="flex g12" style="flex-wrap:wrap;margin-bottom:32px;justify-content:center">
        ${ACCENTS.map(a=>`<button onclick="ob.accent='${a.c}';document.documentElement.style.setProperty('--acc','${a.c}');renderObStep()"
          style="width:48px;height:48px;border-radius:50%;background:${a.c};border:${ob.accent===a.c?'4px solid var(--text)':'3px solid transparent'};cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);transform:${ob.accent===a.c?'scale(1.15)':'scale(1)'}"
          title="${a.n}"></button>`).join('')}
      </div>
      <div class="ob-progress" style="margin-bottom:24px">${dots}</div>
      <button class="btn btn-p btn-fw" onclick="obFinish()" style="font-size:18px;padding:14px;background:var(--acc)">Let's go 🚀</button>
    </div>`;
  }
  ob_el.innerHTML=inner;
}
function obNext(){obStep=Math.min(obStep+1,OB_STEPS-1);renderObStep();}
function obStep1Next(){ob.name=document.getElementById('ob-name')?.value?.trim()||'Champion';obNext();}
function obToggleSubj(label){
  const i=ob.subjects.indexOf(label);
  if(i>-1)ob.subjects.splice(i,1);else ob.subjects.push(label);
  renderObStep();
}
function obFinish(){
  S.profile.name=ob.name||'Champion';
  S.profile.avatar=ob.avatar;
  S.profile.accent=ob.accent||'#007AFF';
  // Add selected subjects
  ob.subjects.forEach(label=>{
    const suggestion=OB_SUBJ_SUGGESTIONS.find(s=>s.label===label)||{sym:'◇',grad:'blue'};
    const preset=GRAD_PRESETS.find(g=>g.key===suggestion.grad)||GRAD_PRESETS[0];
    const id='cat'+(S.nextCatId++);
    S.subjects[id]={label,sym:suggestion.sym,grad:preset.grad,c:preset.c,c2:preset.c2,tasks:[],notes:''};
    S.settings.snotifs[id]=true;
    S.catColorEnabled[id]=true;
  });
  S.onboarded=true;
  save();
  document.getElementById('onboard').style.display='none';
  document.documentElement.style.setProperty('--acc',S.profile.accent);
  document.getElementById('theme-meta')?.setAttribute('content',S.profile.accent);
  render();
  toast('🎉','Welcome, '+S.profile.name+'!','Tsari is ready for you');
}

/* ─── INIT ─── */
setInterval(()=>{if(view==='today')render();},60000);
document.documentElement.style.setProperty('--acc',S.profile.accent||'#007AFF');
document.getElementById('theme-meta')?.setAttribute('content',S.profile.accent||'#007AFF');
S.notifPerm=Notification?.permission||'default';

if(!S.onboarded){
  showOnboard();
} else {
  render();
}
loadYT();
setTimeout(()=>{if(S.settings.notifs&&S.notifPerm==='default')reqNotif();},3000);
setTimeout(()=>{if(S.notifPerm==='granted')reschedNotifs();},4000);
</script>
